; orlyfix settings - in the game folder. A copy in %APPDATA%\Orly's Draw-A-Story
; overrides it; F1-F4 save the filter there.
;
; Fullscreen:  starting mode. 0 = window, 1 = borderless full screen,
;              2 = automatic: full screen with no desktop (Steam Deck Game Mode or another
;              gamescope session), otherwise a window.
;              Alt+Enter switches between window and full screen while playing.
; WindowScale: starting window size, as a multiple of 640x480.
;              The window can be resized freely; the picture scales with it.
; Filter:      0 = sharp pixels, 1 = bilinear, 2 = bicubic, 3 = sharp bilinear.
;              F1-F4 switch while playing, and the choice is saved here.
; VSync:       1 = show each frame in step with the monitor refresh.
[orlyfix]
Fullscreen=2
WindowScale=2
Filter=2
VSync=1
